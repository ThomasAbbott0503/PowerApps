<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia – Faturas Endolog/LOGMED (padrão Abbott)</title>
<style>
  :root{--az:#000075;--gf:#000075;--tx:#1B2A3A;--cz:#5E6A71;--bg:#F4F7F9;--ln:#E3E9ED;--cl:#7FCDEE;--ok:#2E9E6B;--bad:#D64545}
  *{box-sizing:border-box}
  body{margin:0;background:#cfd8de;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx)}
  .top{max-width:1280px;margin:0 auto;padding:12px 12px 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .top h1{font-size:15px;margin:0 12px 0 0;font-weight:600}
  .tab{border:1px solid #b9c5cc;background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
  .tab.on{background:var(--gf);color:#fff;border-color:var(--gf)}
  .note{max-width:1280px;margin:0 auto;padding:0 12px 10px;font-size:12px;color:#44515a}
  .wrap{max-width:1280px;margin:0 auto 24px;padding:0 12px}
  .stage{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
  .canvas{width:1280px;height:720px;transform-origin:0 0;position:absolute;top:0;left:0;background:var(--bg)}
  .hdr{height:56px;background:var(--gf);border-bottom:4px solid #009CDE;color:#fff;display:flex;align-items:center;padding:0 16px;gap:14px}
  .logo{font-weight:700;letter-spacing:2px;font-size:18px;display:flex;align-items:center;gap:8px}
  .logo i{display:inline-block;width:6px;height:28px;background:var(--az);border-radius:2px}
  .ttl{font-size:18px;font-weight:600;padding-left:14px;border-left:1px solid rgba(255,255,255,.35)}
  .meta{margin-left:auto;font-size:12px;opacity:.85;text-align:right;line-height:1.4}
  .flt{display:flex;gap:10px;padding:10px 16px 0;height:50px}
  .sl{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--cz);min-width:120px}
  .sl b{display:block;color:var(--gf);font-size:12px;font-weight:600}
  .seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#fff;margin-left:auto}
  .seg span{padding:10px 14px;font-size:12px}
  .seg .on{background:var(--az);color:#fff;font-weight:600}
  .grid{position:absolute;left:16px;right:16px}
  .card{position:absolute;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px 12px;overflow:hidden}
  .card h3{margin:0 0 6px;font-size:12px;font-weight:600}
  .kpi{border-left:4px solid var(--az)}
  .kpi .l{font-size:11px;color:var(--cz)}
  .kpi .v{font-size:26px;font-weight:600;margin-top:4px}
  .kpi .d{font-size:11px;margin-top:2px;color:var(--cz)}
  .up{color:var(--bad)} .dn{color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:10.5px}
  th{background:var(--gf);color:#fff;text-align:left;padding:5px 6px;font-weight:600}
  td{padding:4px 6px;border-bottom:1px solid var(--ln)}
  tr:nth-child(even) td{background:var(--bg)}
  td.n,th.n{text-align:right}
  tfoot td{background:#E3F4FB!important;font-weight:600}
  svg text{font-family:inherit}
</style>
</head>

function card(x,y,w,h,inner,cls=''){return `<div class="card ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${inner}</div>`}
function kpi(l,v,d){return `<div class="l">${l}</div><div class="v">${v}</div><div class="d">${d||''}</div>`}

function line(vals,labels,w,h){const p=28,mx=Math.max(...vals)*1.12,mn=Math.min(...vals)*0.85;const X=i=>p+i*(w-p*2)/(vals.length-1),Y=v=>h-22-(v-mn)/(mx-mn)*(h-40);
 let pts=vals.map((v,i)=>X(i)+','+Y(v)).join(' ');let s=`<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${AZ}" stroke-width="3"/>`;
 s+=`<polygon points="${X(0)},${h-22} ${pts} ${X(vals.length-1)},${h-22}" fill="${AZ}" opacity=".08"/>`;
 vals.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${AZ}"/><text x="${X(i)}" y="${Y(v)-8}" font-size="9.5" text-anchor="middle" fill="${GF}">${k(v)}</text><text x="${X(i)}" y="${h-6}" font-size="9.5" text-anchor="middle" fill="${CZ}">${labels[i]}</text>`});return s+'</svg>'}
function donut(items,w,h){const r=Math.min(h,w*.5)/2-6,cx=r+10,cy=h/2;let a=-Math.PI/2,s=`<svg width="${w}" height="${h}">`;const tot=items.reduce((t,i)=>t+i[1],0);
 items.forEach((it,i)=>{const b=a+it[1]/tot*2*Math.PI;const lg=b-a>Math.PI?1:0;s+=`<path d="M${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} A${r},${r} 0 ${lg} 1 ${cx+r*Math.cos(b)},${cy+r*Math.sin(b)} L${cx+r*.6*Math.cos(b)},${cy+r*.6*Math.sin(b)} A${r*.6},${r*.6} 0 ${lg} 0 ${cx+r*.6*Math.cos(a)},${cy+r*.6*Math.sin(a)}Z" fill="${PAL[i]}"/>`;
 s+=`<rect x="${cx+r+22}" y="${cy-40+i*22}" width="10" height="10" rx="2" fill="${PAL[i]}"/><text x="${cx+r+38}" y="${cy-31+i*22}" font-size="11" fill="${GF}">${it[0]}  <tspan font-weight="600">${it[1]}%</tspan></text>`;a=b});return s+'</svg>'}
function bars(items,w,h,fmt){const lw=118,mx=Math.max(...items.map(i=>i[1]));const bh=Math.min(22,(h-6)/items.length-6);let s=`<svg width="${w}" height="${h}">`;
 items.forEach((it,i)=>{const y=4+i*(bh+7),bw=(w-lw-70)*it[1]/mx;s+=`<text x="${lw-6}" y="${y+bh/2+4}" font-size="10.5" text-anchor="end" fill="${GF}">${it[0]}</text><rect x="${lw}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${i?CL:AZ}"/><text x="${lw+bw+6}" y="${y+bh/2+4}" font-size="10" fill="${GF}">${fmt(it[1])}</text>`});return s+'</svg>'}
function cols(items,w,h,tot){const mx=Math.max(...items.map(i=>i[1]));const cw=(w-40)/items.length;let s=`<svg width="${w}" height="${h}">`;
 items.forEach((it,i)=>{const v=it[1]/100*tot,bh=(h-40)*it[1]/mx,x=20+i*cw+cw*.2;s+=`<rect x="${x}" y="${h-20-bh}" width="${cw*.6}" height="${bh}" rx="3" fill="${AZ}"/><text x="${x+cw*.3}" y="${h-24-bh}" font-size="10" text-anchor="middle" fill="${GF}">${k(v)}</text><text x="${x+cw*.3}" y="${h-6}" font-size="11" text-anchor="middle" fill="${CZ}">${it[0]}</text>`});return s+'</svg>'}

function pagina(id){const d=DATA[id];const tot=d.serie.reduce((a,b)=>a+b,0);const T=118;
 let h=header(d.titulo);
 const kw=(1248-36)/4;
 h+=card(16,T,kw,84,kpi('Valor cobrado',brl(tot),'Acumulado no ano'),'kpi');
 h+=card(16+(kw+12),T,kw,84,kpi('Qtde de serviços',d.qtde.toLocaleString('pt-BR')),'kpi');
 h+=card(16+2*(kw+12),T,kw,84,kpi('Preço médio por serviço','R$ '+d.pm.toLocaleString('pt-BR',{minimumFractionDigits:2})),'kpi');
 const up=d.var>0;h+=card(16+3*(kw+12),T,kw,84,kpi('Variação vs mês anterior',`<span class="${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(d.var).toLocaleString('pt-BR')}%</span>`,'out/26 vs set/26'),'kpi');
 const y2=T+96;h+=card(16,y2,760,190,`<h3>Evolução mensal do valor cobrado</h3>`+line(d.serie,meses,734,154));
 h+=card(788,y2,476,190,`<h3>Participação por filial</h3>`+donut(d.filial,450,154));
 const y3=y2+202;h+=card(16,y3,400,172,`<h3>Valor por título</h3>`+bars(d.titulo2,376,136,v=>k(v)));
 h+=card(428,y3,400,172,`<h3>Preço médio por tipo de serviço</h3>`+bars(d.tipo,376,136,v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2})));
 h+=card(840,y3,424,172,`<h3>Valor por filial (last mile)</h3>`+cols(d.filial,400,138,tot));
 const y4=y3+184;let rows=d.rows.slice(0,3).map(r=>`<tr>${r.map((c,i)=>`<td class="${i>4?'n':''}">${c}</td>`).join('')}</tr>`).join('');
 h+=card(16,y4,1248,720-y4-12,`<table><thead><tr><th>Filial</th><th>BU</th><th>Tipo de serviço</th><th>Título</th><th>Mês</th><th class="n">Qtde</th><th class="n">Preço médio</th><th class="n">Cobrado (R$)</th></tr></thead><tbody>${rows}</tbody></table>`);
 return h}

function cost(){const e=DATA.endolog,l=DATA.logmed;const te=e.serie.reduce((a,b)=>a+b,0),tl=l.serie.reduce((a,b)=>a+b,0);const T=118,kw=(1248-36)/4;
 let h=header('Cost Drive – Endolog + LOGMED');
 h+=card(16,T,kw,84,kpi('Total faturado',brl(te+tl),'Endolog + LOGMED'),'kpi');
 h+=card(16+(kw+12),T,kw,84,kpi('Peso Endolog',(te/(te+tl)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%','do total faturado'),'kpi');
 h+=card(16+2*(kw+12),T,kw,84,kpi('Acumulado ano Endolog',brl(te)),'kpi');
 h+=card(16+3*(kw+12),T,kw,84,kpi('Acumulado ano LOGMED',brl(tl)),'kpi');
 function mtx(t,d){const ms=meses.slice(-5);const max=Math.max(...d.tipo.map(x=>x[1]));let s=`<h3>${t}</h3><table><thead><tr><th>Tipo de serviço</th>${ms.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>`;
  let colt=Array(ms.length).fill(0),gt=0;
  d.tipo.forEach((tp,i)=>{let tot=0;s+=`<tr><td>${tp[0]}</td>`+ms.map((m,j)=>{const v=Math.round(tp[1]*(900-i*140)*(1+j*.03));tot+=v;colt[j]+=v;const a=.08+.5*v/(max*900*1.15);return `<td class="n" style="background:rgba(0,156,222,${a.toFixed(2)})">${k(v)}</td>`}).join('')+`<td class="n"><b>${k(tot)}</b></td></tr>`;gt+=tot});
  return s+`</tbody><tfoot><tr><td>Total</td>${colt.map(v=>`<td class="n">${k(v)}</td>`).join('')}<td class="n">${k(gt)}</td></tr></tfoot></table>`}
 const y2=T+96;h+=card(16,y2,618,190,mtx('Endolog – valor por tipo de serviço e mês',e));
 h+=card(646,y2,618,190,mtx('LOGMED – valor por tipo de serviço e mês',l));
 const y3=y2+202,W=1224,H=720-y3-12-40;let sv=`<svg width="${W}" height="${H}">`;const mx=Math.max(...e.serie.map((v,i)=>v+l.serie[i]));const cw=(W-20)/meses.length;
 meses.forEach((m,i)=>{const he=(H-34)*e.serie[i]/mx,hl=(H-34)*l.serie[i]/mx,x=10+i*cw+cw*.25,w=cw*.5;
  sv+=`<rect x="${x}" y="${H-18-he}" width="${w}" height="${he}" fill="${AZ}"/><rect x="${x}" y="${H-18-he-hl}" width="${w}" height="${hl}" fill="${GF}"/><text x="${x+w/2}" y="${H-22-he-hl}" font-size="9.5" text-anchor="middle" fill="${GF}">${k(e.serie[i]+l.serie[i])}</text><text x="${x+w/2}" y="${H-4}" font-size="9.5" text-anchor="middle" fill="${CZ}">${m}</text>`});
 sv+='</svg>';
 h+=card(16,y3,1248,720-y3-12,`<h3>Total faturado por mês <span style="font-weight:400;color:${CZ};font-size:11px">&nbsp;<span style="color:${AZ}">■</span> Endolog &nbsp;<span style="color:${GF}">■</span> LOGMED</span></h3>`+sv);
 return h}

const cv=document.getElementById('cv'),st=document.getElementById('stage');
function show(p){cv.innerHTML=p==='cost'?cost():pagina(p);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p===p))}
function fit(){cv.style.transform=`scale(${st.clientWidth/1280})`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.p));
window.addEventListener('resize',fit);show(['logmed','cost'].includes(location.hash.slice(1))?location.hash.slice(1):'endolog');fit();
</script>
